# Render Blueprint Specification for CivicPulse AI (Track 1 - Civic Pulse)
# Autonomous Public Service & Bureaucracy Execution Agent
# ==============================================================================

services:
  - type: web
    name: civicpulse-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx playwright install chromium
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: "true"
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: https://civicpulse-frontend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false

  - type: web
    name: civicpulse-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://civicpulse-backend.onrender.com
