# ==============================================================================
# Render Blueprint Specification for CivicPulse AI (Track 1 - Civic Pulse)
# Autonomous Public Service & Bureaucracy Execution Agent
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. CivicPulse Express Backend & Playwright Agent Engine
  # ----------------------------------------------------------------------------
  - type: web
    name: civicpulse-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx playwright install chromium
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: "true"
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: civicpulse-frontend
          property: host
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false

  # ----------------------------------------------------------------------------
  # 2. CivicPulse React + Vite Citizen Command Dashboard (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: civicpulse-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: civicpulse-backend
          property: host
